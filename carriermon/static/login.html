<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrier Monitor — Sign in</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%232878e6'/></svg>">
<style>
  :root { color-scheme: light dark; --fg:#222; --bg:#fff; --muted:#777; --card:#f6f6f8; --line:#ddd; --accent:#2878e6; --err:#c0392b; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e6e6e6; --bg:#141518; --muted:#999; --card:#1e2024; --line:#333; --accent:#4d94ff; --err:#e57373; } }
  body { margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center; font:14px/1.4 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  form { width:min(320px, calc(100vw - 2rem)); padding:1.4rem 1.4rem 1.6rem; background:var(--card); border:1px solid var(--line); border-radius:10px; box-sizing:border-box; }
  h1 { font-size:1.15rem; margin:0 0 1rem; }
  label { display:block; font-size:.8rem; color:var(--muted); margin:.7rem 0 .2rem; }
  input { width:100%; box-sizing:border-box; font:inherit; padding:.5rem .55rem; border:1px solid var(--line); border-radius:6px; background:var(--bg); color:var(--fg); }
  input:focus { outline:2px solid var(--accent); outline-offset:0; border-color:var(--accent); }
  button { width:100%; margin-top:1.1rem; font:inherit; font-weight:600; padding:.55rem; border:0; border-radius:6px; background:var(--accent); color:#fff; cursor:pointer; }
  .err { margin:.4rem 0 0; color:var(--err); font-size:.85rem; }
  .err:empty { display:none; }

  /* Dev checkout (CARRIERMON_DEV=1): amber accent, matching the dashboard. */
  #devbadge { display:none; }
  :root[data-env="dev"] { --accent:#d97706; }
  @media (prefers-color-scheme: dark) { :root[data-env="dev"] { --accent:#f59e0b; } }
  [data-env="dev"] #devbadge { display:inline-block; margin-left:.5rem; padding:.1rem .45rem; border-radius:4px; background:var(--accent); color:#fff;
                               font-weight:700; font-size:.7rem; letter-spacing:.08em; vertical-align:middle; }
</style>
</head>
<body>
<form method="post" action="/login">
  <h1>Carrier Monitor<span id="devbadge">DEV</span></h1>
  <label for="username">Username</label>
  <input id="username" name="username" type="text" autocomplete="username" autofocus required>
  <label for="password">Password</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>
  <p class="err">{error}</p>
  <button type="submit">Sign in</button>
</form>
</body>
</html>
