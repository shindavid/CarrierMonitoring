<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carrier Control</title>
<link id="favicon" rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23e6503c'/></svg>">
<style>
  :root { color-scheme: light dark; --fg:#222; --bg:#fff; --muted:#777; --card:#f6f6f8; --line:#ddd;
          --on:#16a34a; --off:#6b7280; --heat:#e63c1e; --cool:#2860e6; --warn:#b45309; --warnbg:#fef3c7; --bad:#b91c1c; --badbg:#fee2e2; }
  @media (prefers-color-scheme: dark) { :root { --fg:#e6e6e6; --bg:#141518; --muted:#999; --card:#1e2024; --line:#333;
          --warnbg:#3b2a08; --bad:#fca5a5; --badbg:#3f1212; } }
  body { margin:0; font:16px/1.45 system-ui, sans-serif; color:var(--fg); background:var(--bg); }
  header { display:flex; flex-wrap:wrap; gap:.4rem 1rem; align-items:center; padding:.6rem 1rem; border-bottom:1px solid var(--line); }
  header h1 { font-size:1.1rem; margin:0; }
  header a { color:var(--muted); text-decoration:none; }
  main { max-width:680px; margin:0 auto; padding:.8rem; display:grid; gap:.8rem; }
  .card { padding:.8rem 1rem; background:var(--card); border-radius:10px; }
  .card h2 { font-size:.85rem; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 .5rem; }
  button { font:inherit; padding:.5rem .9rem; border-radius:8px; border:1px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer; }
  button:disabled { opacity:.45; cursor:default; }
  #power { min-width:7.5rem; font-weight:700; font-size:1.05rem; color:#fff; border:none; background:var(--off); }
  #power.on { background:var(--on); }
  /* Zone settings: zone | ☀ day | ☾ night. Each period cell is a 4-column grid
     (label, value, −, +) so every button lines up down the page. */
  .zgrid { display:grid; grid-template-columns:auto 1fr 1fr; gap:.4rem .9rem; align-items:start; }
  .zgrid .hdr { font-size:.85rem; color:var(--muted); text-transform:uppercase; letter-spacing:.05em; padding-bottom:.2rem; border-bottom:1px solid var(--line); }
  .zgrid .hdr .ico { font-size:1.1rem; margin-right:.3rem; vertical-align:-.1rem; }
  .zgrid .zname { font-weight:700; padding-top:.35rem; }
  .zgrid .ztemp { font-weight:400; font-size:1.5rem; color:var(--muted); font-variant-numeric:tabular-nums; line-height:1.2; }
  .zgrid .ztemp small { font-size:.75rem; }
  .zgrid .sep { grid-column:1 / -1; border-top:1px solid var(--line); }
  .cell { display:grid; gap:.35rem; padding:.3rem .5rem .4rem; border-radius:8px; min-width:11rem; }
  .cell.active { background:color-mix(in srgb, var(--fg) 6%, transparent); }
  .cell .from { display:flex; align-items:center; gap:.4rem; color:var(--muted); font-size:.85rem; }
  .cell.active .from { color:var(--fg); }
  .cell .from input[type=time] { font:inherit; font-size:.85rem; padding:.1rem .25rem; border-radius:6px; border:1px solid var(--line); background:var(--bg); color:var(--fg); }
  /* Two sliders on the same 60-80 scale, stacked so the tracks line up:
     range  —  min value | track with min/max markers and a filled band | max value
     target —           | track with one knob, its value floating above |          */
  .sl { display:grid; grid-template-columns:2rem 1fr 2rem; align-items:center; gap:.3rem; font-variant-numeric:tabular-nums; }
  .sl .end { font-size:.9rem; color:var(--muted); }
  .sl .end.r { text-align:right; }
  .slider { position:relative; touch-action:none; user-select:none; -webkit-user-select:none; }
  .slider.range { height:1.4rem; }
  .slider.target { height:2.6rem; }
  .slider .track { position:absolute; left:0; right:0; height:4px; border-radius:2px; background:var(--line); }
  .slider.range .track, .slider.range .fill, .slider.range .mark { top:.7rem; }
  .slider.target .track, .slider.target .mark { top:1.9rem; }
  .slider .fill { position:absolute; height:4px; border-radius:2px; background:color-mix(in srgb, var(--muted) 55%, transparent); }
  .slider .mark { position:absolute; transform:translate(-50%, -50%); margin-top:2px; cursor:grab; }
  .slider .mark::after { content:""; position:absolute; inset:-.7rem; }   /* fat touch target */
  .slider .mark.lo, .slider .mark.hi { width:6px; height:16px; border-radius:3px; background:var(--muted); }
  .slider .mark.d { width:16px; height:16px; border-radius:50%; background:var(--fg); border:2px solid var(--bg); box-shadow:0 0 0 1px var(--muted); }
  .slider .dval { position:absolute; top:0; transform:translateX(-50%); font-weight:700; font-size:1.05rem; white-space:nowrap; }
  .slider.target .band { position:absolute; top:1.9rem; height:4px; background:color-mix(in srgb, var(--muted) 25%, transparent); }
  .steppers { display:grid; grid-template-columns:1fr 1fr 1fr; justify-items:center; }
  .stp { display:grid; justify-items:center; gap:.15rem; }
  .stp .lbl { font-size:.75rem; color:var(--muted); }
  .stp .lbl.d { color:var(--fg); font-weight:600; }
  .stp button { width:2.3rem; height:1.75rem; padding:0; font-size:1.05rem; line-height:1; }
  .cell .pname { display:none; font-weight:600; color:var(--fg); margin-right:.3rem; }
  .cell .pname .ico { font-size:1rem; margin-right:.2rem; }
  /* Phones: one column. Zone name + temp on a line, then the day cell, then the night
     cell, each full width; the period label moves into the cell's "from" line. */
  @media (max-width: 560px) {
    main { padding:.5rem; }
    .card { padding:.6rem .7rem; }
    .zgrid { grid-template-columns:1fr; gap:.3rem; }
    .zgrid .hdr { display:none; }
    .zgrid .zname { display:flex; align-items:baseline; gap:.6rem; padding-top:.2rem; }
    .zgrid .ztemp { font-size:1.2rem; }
    .cell { min-width:0; }
    .cell .pname { display:inline; }
  }
  .banner { padding:.6rem .9rem; border-radius:8px; display:none; }
  .banner.show { display:block; }
  .banner.warn { background:var(--warnbg); color:var(--warn); }
  .banner.bad { background:var(--badbg); color:var(--bad); }
  .kv { display:grid; grid-template-columns:auto 1fr; gap:.25rem 1rem; }
  .kv dt { color:var(--muted); }
  .kv dd { margin:0; }
  .mode { font-weight:700; text-transform:uppercase; }
  .mode.heat { color:var(--heat); } .mode.cool { color:var(--cool); }
  table { width:100%; border-collapse:collapse; font-variant-numeric:tabular-nums; }
  th, td { text-align:left; padding:.25rem .4rem; border-bottom:1px solid var(--line); }
  th { font-weight:600; color:var(--muted); font-size:.85rem; }
  td.num { text-align:right; }
  .hot { color:var(--heat); } .cold { color:var(--cool); }
  #status { color:var(--muted); font-size:.85rem; margin-left:auto; }

  #devbadge { display:none; }
  :root[data-env="dev"] { --dev:#d97706; }
  @media (prefers-color-scheme: dark) { :root[data-env="dev"] { --dev:#f59e0b; } }
  [data-env="dev"] header { background:color-mix(in srgb, var(--dev) 14%, var(--bg)); border-bottom:3px solid var(--dev); }
  [data-env="dev"] #devbadge { display:inline-block; padding:.1rem .45rem; border-radius:4px; background:var(--dev); color:#fff; font-weight:700; font-size:.8rem; letter-spacing:.08em; }
  [data-env="dev"] header h1 { color:var(--dev); }
  [data-env="dev"] body::after { content:""; position:fixed; inset:0; border:3px solid var(--dev); pointer-events:none; z-index:10; }
</style>
</head>
<body>
<header>
  <span id="devbadge" title="Dev checkout: the controller here is always dry-run">DEV</span>
  <h1>Carrier Control</h1>
  <a href="/">← Dashboard</a>
  <span id="status"></span>
</header>
<main>
  <div id="override" class="banner bad"></div>
  <div id="loopwarn" class="banner warn"></div>
  <div id="drywarn" class="banner warn"></div>
  <div id="saveerr" class="banner bad"></div>

  <div class="card">
    <button id="power">…</button>
  </div>

  <div class="card">
    <h2>Zones — target and tolerable range</h2>
    <div id="zonecfg"></div>
  </div>

  <div class="card">
    <h2>Controller</h2>
    <dl class="kv">
      <dt>Mode</dt><dd id="mode">–</dd>
      <dt>Because</dt><dd id="rule">–</dd>
      <dt>Rules ask for</dt><dd id="decision">–</dd>
      <dt>House</dt><dd id="lean">–</dd>
      <dt>Thermostat</dt><dd id="thermo">–</dd>
      <dt>Outdoor</dt><dd id="oat">–</dd>
      <dt>Last check</dt><dd id="lasteval">–</dd>
    </dl>
  </div>

  <div class="card">
    <h2>Zones now</h2>
    <table>
      <thead><tr><th>Zone</th><th class="num">Temp</th><th class="num">Want</th><th>Status</th><th class="num">Heat sp</th><th class="num">Cool sp</th><th>Hold</th></tr></thead>
      <tbody id="zones"></tbody>
    </table>
  </div>

</main>

<script>
const $ = s => document.querySelector(s);
if (document.documentElement.dataset.env === 'dev') {
  document.title = 'DEV — ' + document.title;
  $('#favicon').href = "data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='13' fill='%23d97706'/><text x='16' y='22' font-size='18' font-family='sans-serif' font-weight='bold' fill='%23fff' text-anchor='middle'>D</text></svg>";
}

let data = null;
const pending = {};   // `${entity}|${period}` -> {lo, d, hi} being edited (debounced)
const timers = {};
const MIN_W = 2, T_MIN = 60, T_MAX = 80;   // the slider spans this; the API allows a bit more
const fmtT = ts => ts ? new Date(ts * 1000).toLocaleString([], {month:'numeric', day:'numeric', hour:'numeric', minute:'2-digit'}) : '–';
const ago = ts => { if (!ts) return '–'; const m = Math.round((Date.now()/1000 - ts) / 60); return m < 1 ? 'just now' : m < 90 ? `${m} min ago` : `${Math.round(m/60)} h ago`; };
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

function periodNow(z) {  // mirrors period_now() in control.py
  const t = new Date().toTimeString().slice(0, 5);
  if (z.day_start <= z.night_start) return (z.day_start <= t && t < z.night_start) ? 'day' : 'night';
  return (t >= z.day_start || t < z.night_start) ? 'day' : 'night';
}

// One period cell: "from [07:00]", a three-marker slider (min | target | max on a
// 60-80 track, draggable), then a stacked +/− pair for each of Min, Target, Max.
const pct = v => `${(v - T_MIN) / (T_MAX - T_MIN) * 100}%`;
function cellHtml(z, period) {
  const key = `${z.entity}|${period}`;
  const v = pending[key] || {lo: z[`${period}_lo`], d: z[`${period}_d`], hi: z[`${period}_hi`]};
  const stp = (f, label, cls) => `<div class="stp">
      <button data-k="${esc(key)}" data-f="${f}" data-d="1" aria-label="raise ${label}">+</button>
      <span class="lbl ${cls}">${label}</span>
      <button data-k="${esc(key)}" data-f="${f}" data-d="-1" aria-label="lower ${label}">−</button></div>`;
  return `<div class="cell" data-k="${esc(key)}">
    <span class="from"><span class="pname"><span class="ico">${period === 'day' ? '☀' : '☾'}</span>${period === 'day' ? 'Day' : 'Night'}</span>from <input type="time" data-e="${esc(z.entity)}" data-f="${period}_start" value="${esc(z[`${period}_start`])}"></span>
    <div class="sl"><span class="end">${v.lo}</span>
      <div class="slider range" data-k="${esc(key)}">
        <div class="track"></div>
        <div class="fill" style="left:${pct(v.lo)};width:calc(${pct(v.hi)} - ${pct(v.lo)})"></div>
        <div class="mark lo" data-f="lo" style="left:${pct(v.lo)}"></div>
        <div class="mark hi" data-f="hi" style="left:${pct(v.hi)}"></div>
      </div>
      <span class="end r">${v.hi}</span></div>
    <div class="sl"><span></span>
      <div class="slider target" data-k="${esc(key)}">
        <div class="track"></div>
        <div class="band" style="left:${pct(v.lo)};width:calc(${pct(v.hi)} - ${pct(v.lo)})"></div>
        <div class="dval" style="left:${pct(v.d)}">${v.d}</div>
        <div class="mark d" data-f="d" style="left:${pct(v.d)}"></div>
      </div>
      <span></span></div>
    <div class="steppers">${stp('lo', 'Min', '')}${stp('d', 'Target', 'd')}${stp('hi', 'Max', '')}</div>
  </div>`;
}

// The controls are built once per zone list and then updated in place, so a click,
// a drag or a time-picker edit is never interrupted by the DOM being rebuilt under it
// (every save response and the 30 s refresh come through here).
function renderZoneCfg() {
  const sig = data.zones.map(z => z.entity + ':' + z.name).join(',');
  let grid = $('#zonecfg .zgrid');
  if (!grid || grid.dataset.sig !== sig) {
    const head = `<div class="hdr zonehdr">Zone</div><div class="hdr"><span class="ico">☀</span>Day</div><div class="hdr"><span class="ico">☾</span>Night</div>`;
    const rows = data.zones.map((z, i) =>
      `${i ? '<div class="sep"></div>' : ''}<div class="zname">${esc(z.name)}<div class="ztemp" data-e="${esc(z.entity)}">–</div></div>${cellHtml(z, 'day')}${cellHtml(z, 'night')}`).join('');
    $('#zonecfg').innerHTML = data.zones.length ? `<div class="zgrid">${head}${rows}</div>` : '<em>no zones known yet</em>';
    grid = $('#zonecfg .zgrid');
    if (!grid) return;
    grid.dataset.sig = sig;
    grid.querySelectorAll('button[data-k]').forEach(b => b.onclick = () => bump(b.dataset.k, b.dataset.f, +b.dataset.d));
    grid.querySelectorAll('.slider .mark').forEach(m => m.onpointerdown = startDrag);
    grid.querySelectorAll('input[type=time]').forEach(i => i.onchange = e => {
      if (e.target.value) post({zones: {[i.dataset.e]: {[i.dataset.f]: e.target.value}}});
    });
  }
  const temps = Object.fromEntries((((data.state || {}).last_eval || {}).zones || []).map(z => [z.entity, z.rt]));
  for (const z of data.zones) {
    const t = temps[z.entity];
    $(`#zonecfg .ztemp[data-e="${CSS.escape(z.entity)}"]`).innerHTML = t == null ? '–' : `${t}<small>°F now</small>`;
    for (const period of ['day', 'night']) paintCell(z, period);
  }
}
function paintCell(z, period) {
  const key = `${z.entity}|${period}`;
  const cell = document.querySelector(`#zonecfg .cell[data-k="${CSS.escape(key)}"]`);
  if (!cell) return;
  cell.classList.toggle('active', periodNow(z) === period);
  const inp = cell.querySelector('input[type=time]');
  if (document.activeElement !== inp && inp.value !== z[`${period}_start`]) inp.value = z[`${period}_start`];
  paintSlider(key, current(key));
}

// Keep lo <= d <= hi and hi - lo >= 2 while the user presses buttons: moving an edge
// pushes the desired temp along, moving the desired temp pushes the edges along.
function current(key) {
  const [entity, period] = key.split('|');
  const z = data.zones.find(z => z.entity === entity);
  return pending[key] || {lo: z[`${period}_lo`], d: z[`${period}_d`], hi: z[`${period}_hi`]};
}
function bump(key, field, delta) { setVal(key, field, current(key)[field] + delta); }
function setVal(key, field, value) {
  const [entity, period] = key.split('|');
  const v = current(key);
  const n = {...v};
  n[field] = Math.min(T_MAX, Math.max(T_MIN, Math.round(value)));
  if (n[field] === v[field]) return;
  const delta = n[field] - v[field];
  // Pushing the target past an edge carries that edge along (the other edge stays);
  // moving an edge carries the target along and keeps the range at least MIN_W wide.
  if (field === 'd')  { if (n.d > n.hi) n.hi = n.d; if (n.d < n.lo) n.lo = n.d; }
  if (field === 'lo') { if (n.hi < n.lo + MIN_W) n.hi = n.lo + MIN_W; if (n.d < n.lo) n.d = n.lo; }
  if (field === 'hi') { if (n.lo > n.hi - MIN_W) n.lo = n.hi - MIN_W; if (n.d > n.hi) n.d = n.hi; }
  if (n.hi > T_MAX || n.lo < T_MIN) return;
  if (n.lo === v.lo && n.d === v.d && n.hi === v.hi) return;
  pending[key] = n;
  applyLocal(key, n);   // optimistic: the page shows the edit even while a save is in flight
  paintSlider(key, n);
  clearTimeout(timers[key]);
  timers[key] = setTimeout(async () => {
    const send = pending[key];
    await post({zones: {[entity]: {[`${period}_lo`]: send.lo, [`${period}_d`]: send.d, [`${period}_hi`]: send.hi}}});
    if (pending[key] === send) { delete pending[key]; renderZoneCfg(); }   // no newer edit since
  }, 700);
}
function applyLocal(key, n) {
  const [entity, period] = key.split('|');
  const z = data.zones.find(z => z.entity === entity);
  if (z) { z[`${period}_lo`] = n.lo; z[`${period}_d`] = n.d; z[`${period}_hi`] = n.hi; }
}
function overlayPending() {   // after any fetch: edits still in flight win over what the server sent
  for (const key of Object.keys(pending)) applyLocal(key, pending[key]);
}

// Dragging a marker: map pointer x to a whole degree on the 60-80 track and feed it
// through the same constraint logic as the buttons. While dragging only the slider is
// repainted (a full re-render would drop the pointer capture).
let dragging = null;
function startDrag(e) {
  const mark = e.currentTarget, slider = mark.parentElement;
  dragging = {key: slider.dataset.k, field: mark.dataset.f, slider};
  mark.setPointerCapture(e.pointerId);
  mark.onpointermove = ev => {
    const r = slider.getBoundingClientRect();
    const frac = Math.min(1, Math.max(0, (ev.clientX - r.left) / r.width));
    setVal(dragging.key, dragging.field, T_MIN + frac * (T_MAX - T_MIN));
  };
  mark.onpointerup = mark.onpointercancel = () => { mark.onpointermove = null; dragging = null; };
  e.preventDefault();
}
function paintSlider(key, v) {
  const range = document.querySelector(`#zonecfg .slider.range[data-k="${CSS.escape(key)}"]`);
  const target = document.querySelector(`#zonecfg .slider.target[data-k="${CSS.escape(key)}"]`);
  if (!range || !target) return;
  const bandCss = el => { el.style.left = pct(v.lo); el.style.width = `calc(${pct(v.hi)} - ${pct(v.lo)})`; };
  bandCss(range.querySelector('.fill'));
  range.querySelector('.mark.lo').style.left = pct(v.lo);
  range.querySelector('.mark.hi').style.left = pct(v.hi);
  const ends = range.parentElement.querySelectorAll('.end'); ends[0].textContent = v.lo; ends[1].textContent = v.hi;
  bandCss(target.querySelector('.band'));
  target.querySelector('.mark.d').style.left = pct(v.d);
  const dv = target.querySelector('.dval'); dv.style.left = pct(v.d); dv.textContent = v.d;
}

function render() {
  const {settings, state, config} = data;
  const on = settings.enabled;
  $('#power').textContent = on ? 'ON' : 'OFF';
  $('#power').className = on ? 'on' : '';
  renderZoneCfg();

  const ov = $('#override');
  ov.className = 'banner bad' + (state.override ? ' show' : '');
  ov.textContent = state.override ? `Switched off ${fmtT(state.override_ts)}: ${state.override}. Press ON to take control again.` : '';
  const lw = $('#loopwarn');
  lw.className = 'banner warn' + (!state.loop_alive ? ' show' : '');
  lw.textContent = state.loop_alive ? '' : config.dev
    ? 'Controller loop is not running. Start it here with `carriermon control` (dry-run).'
    : 'Controller loop is not running (the ingest service hosts it). Nothing will be written until it is back.';
  const dw = $('#drywarn');
  dw.className = 'banner warn' + (state.loop_alive && state.dry_run ? ' show' : '');
  dw.textContent = state.dry_run ? 'DRY RUN: decisions are logged but nothing is written to the thermostat.' : '';

  const ev = state.last_eval || {};
  const modeEl = $('#mode');
  modeEl.textContent = on && state.mode ? state.mode : (on ? 'deciding…' : 'off');
  modeEl.className = 'mode ' + (on && state.mode ? state.mode : '');
  if (on && state.mode_since) modeEl.textContent += ` (since ${fmtT(state.mode_since)})`;
  $('#rule').textContent = on ? (state.rule || '–') : 'controller is off; the thermostat is on its own';
  $('#decision').textContent = ev.decision_rule ? `${ev.decision || 'no change'} — ${ev.decision_rule}` : '–';
  $('#lean').textContent = ev.lean ? `every zone ${ev.lean} its desired temp for ${Math.floor((ev.lean_for || 0) / 60)} min (switches at 5)` : (ev.zones ? 'zones straddle their desired temps' : '–');
  $('#thermo').textContent = ev.thermostat_mode ? `mode ${ev.thermostat_mode}` : '–';
  $('#oat').textContent = ev.oat != null ? `${ev.oat} °F` : '–';
  $('#lasteval').textContent = state.last_eval_ts ? `${ago(state.last_eval_ts)}${ev.mismatch ? ' — mismatch: ' + ev.mismatch : ''}` : 'never';

  $('#zones').innerHTML = (ev.zones || []).map(z => {
    const status = z.rt == null ? '–' : z.rt > z.hi ? `<span class="hot">above</span>` : z.rt < z.lo ? `<span class="cold">below</span>`
                 : z.rt > z.d ? 'ok, warm side' : z.rt < z.d ? 'ok, cool side' : 'at desired';
    return `<tr><td>${esc(z.name)}</td><td class="num">${z.rt ?? '–'}</td><td class="num">${z.d} <small>(${z.lo}–${z.hi}, ${z.period})</small></td>
            <td>${status}</td><td class="num">${z.htsp ?? '–'}</td><td class="num">${z.clsp ?? '–'}</td><td>${z.hold ?? '–'}</td></tr>`;
  }).join('') || '<tr><td colspan="7">no evaluation yet</td></tr>';

  $('#status').textContent = `updated ${new Date().toLocaleTimeString()}`;
}

async function load() {
  try { data = await (await fetch('/api/control')).json(); overlayPending(); render(); }
  catch (e) { $('#status').textContent = 'load failed: ' + e; }
}
async function post(body) {
  const r = await fetch('/api/control', {method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body)});
  const se = $('#saveerr');
  if (!r.ok) {
    let msg = await r.text(); try { msg = JSON.parse(msg).detail; } catch (_) {}
    se.textContent = 'Not saved: ' + (typeof msg === 'string' ? msg : JSON.stringify(msg)); se.className = 'banner bad show';
    for (const k of Object.keys(pending)) delete pending[k];   // drop the rejected edit, show the server's truth
    await load(); return;
  }
  se.className = 'banner bad';
  data = await r.json(); overlayPending(); render();
}

$('#power').onclick = () => post({enabled: !data.settings.enabled});

load();
setInterval(load, 30000);
</script>
</body>
</html>
