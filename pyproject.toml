[project]
name = "carriermon"
version = "0.1.0"
description = "Historical monitoring/diagnostics for a Carrier Infinity HVAC system"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "carrier_api",
    "fastapi",
    "uvicorn[standard]",
]

[project.scripts]
carriermon = "carriermon.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["carriermon*"]

[tool.setuptools.package-data]
carriermon = ["static/*"]
